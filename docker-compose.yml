services:
  postgres:
    build:
      context: .
      args:
        POSTGRES_VERSION: "18"
        APT_MIRROR: ${APT_MIRROR:-}
        FETCH_HTTP_PROXY: ${FETCH_HTTP_PROXY:-}
        FETCH_HTTPS_PROXY: ${FETCH_HTTPS_PROXY:-}
    image: "${POSTGRES_OMINI_IMAGE:-postgres-omini:local}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-empty password}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
    ports:
      - "${POSTGRES_HOST_IP:-127.0.0.1}:${PGHOST_PORT:-5432}:5432"
    volumes:
      - postgres-omini-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "docker-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres-omini-data:

